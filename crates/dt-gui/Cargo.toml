[package]
name = "dt-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "deadtune"
path = "src/main.rs"

[features]
default = []
remote = ["dep:tiny_http"]

[dependencies]
dt-core.workspace = true
anyhow.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
tiny_http = { version = "0.12", optional = true }
