[workspace]
resolver = "3"
members = ["crates/dt-core", "crates/dt-cli", "crates/dt-gui"]

[workspace.package]
version = "0.27.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.95"

[workspace.dependencies]
dt-core = { path = "crates/dt-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.dt-core]
opt-level = 1

[profile.release]
opt-level = "s"
lto = false
codegen-units = 16
incremental = true
panic = "abort"
strip = true

# Optimised like release, but quick to build: for running the app locally, not for shipping.
[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true
strip = false
