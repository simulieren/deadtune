[package]
name = "dt-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
fetch = ["dep:ureq"]
# SVG rasterising for icon previews (resvg, 591 KB on the Windows binary); the GUI only.
svg = ["dep:resvg"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
sha2 = "0.10"
similar = "3.2"
minisign-verify = "0.3"
serde_json = "1"
csv = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
steamlocate = "2.1.1"
notify = "8.2"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
ureq = { version = "3", optional = true }
# Already linked by ureq and png; reads cfg.zip for remote presets.
flate2 = "1"
# Already linked into the GUI by eframe; decodes the PNGs players swap in for UI icons and
# writes the ones snapshots export.
png = "0.18"
resvg = { version = "0.48.1", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_Foundation", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_Devices_DeviceAndDriverInstallation"] }

[dev-dependencies]
tempfile.workspace = true
