[package]
name = "dt-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "deadtune"
path = "src/main.rs"

[features]
default = []
remote = ["dep:tiny_http"]
fetch = ["dt-core/fetch"]

[build-dependencies]
embed-resource = "3"

[dependencies]
dt-core = { workspace = true, features = ["svg"] }
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "links", "x11", "wayland"] }
tiny_http = { version = "0.12", optional = true }
# Decodes the HUD reference screenshot (assets/vanilla_hud.jpg). Measured on the Windows
# release exe: decoder about 105 KB, a 1280x720 JPEG 100 KB; the same picture as a
# 960x540 128-colour PNG through the already linked png crate is 196 KB and visibly worse.
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile.workspace = true
# Already in the tree through epaint; the glyph test reads the Inter charmaps with it.
skrifa = "0.44"
