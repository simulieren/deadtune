name: CI

# Format, build and tests on every push to main and every pull request. The Python 1.x app was
# retired with 2.0.0 (docs/csharp-rewrite.md, M7).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_PATH: DL-FOV-Fixer.slnx
  # DotNetLib.Tray comes from dotnetlib's private GitHub Packages feed, the "dotnetlib" source in
  # nuget.config. NuGet reads its credentials from this variable. The secret is a classic PAT with
  # read:packages only. Pull requests from forks get no secrets, so their restore fails.
  NuGetPackageSourceCredentials_dotnetlib: Username=lukr-99;Password=${{ secrets.DOTNETLIB_PACKAGES_TOKEN }}

jobs:
  dotnet:
    name: .NET format, build and tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Parse-check PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Path installer, tools -Recurse -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) {
              Write-Host "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Restore
        run: dotnet restore $env:SOLUTION_PATH

      - name: Check formatting
        run: dotnet format $env:SOLUTION_PATH --verify-no-changes --no-restore

      - name: Build
        run: dotnet build $env:SOLUTION_PATH -c Release --no-restore

      - name: Test
        run: >-
          dotnet test --solution $env:SOLUTION_PATH -c Release --no-build
          --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: TestResults/
          if-no-files-found: warn
